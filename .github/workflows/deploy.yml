name: Deploy Odoo 17 - gestion_tareas

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-odoo-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sincronizar módulo con EC2
        id: sync
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          # Detectar cambios XML respecto al commit anterior.
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
            | grep -E '^(.*/)?views/.*\.xml$'; then
            echo "xml_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "xml_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # En la primera ejecución, forzar actualización.
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "xml_changed=true" >> "$GITHUB_OUTPUT"
          fi

          ssh "$EC2_USER@$EC2_HOST" \
            'mkdir -p /home/ubuntu/odoo17/addons/gestion_tareas'

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ "$EC2_USER@$EC2_HOST:/home/ubuntu/odoo17/addons/gestion_tareas/"

      - name: Limpiar caché y actualizar módulo
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          XML_CHANGED: ${{ steps.sync.outputs.xml_changed }}
        run: |
          set -euo pipefail

          ssh "$EC2_USER@$EC2_HOST" \
            "ODOO_DB='$ODOO_DB' XML_CHANGED='$XML_CHANGED' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/ubuntu/odoo17

          MODULE=/home/ubuntu/odoo17/addons/gestion_tareas

          # Eliminar únicamente caché Python del módulo.
          find "$MODULE" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$MODULE" -type f -name '*.pyc' -delete

          # Confirmar que Docker Compose contiene los servicios esperados.
          docker compose config --services | grep -qx 'odoo'
          docker compose config --services | grep -qx 'db'

          # Verificar que PostgreSQL está disponible.
          docker compose exec -T db \
            pg_isready -U odoo -d "$ODOO_DB"

          # Verificar que Odoo puede reconocer el módulo y actualizarlo.
          # -u instala el módulo si aún no está instalado y actualiza
          # sus vistas/datos si ya lo está.
          docker compose run --rm --no-deps odoo \
            odoo -d "$ODOO_DB" \
            --db_host=db \
            --db_user=odoo \
            -u gestion_tareas \
            --stop-after-init

          # Si hubo cambios XML, reiniciar el servicio Odoo para
          # que el proceso normal vuelva a cargar el código actualizado.
          if [ "$XML_CHANGED" = "true" ]; then
            docker compose restart odoo
          fi

          # Confirmar estado del contenedor.
          docker compose ps
          REMOTE

      - name: Resultado del despliegue
        run: echo "Despliegue y actualización de gestion_tareas finalizados."
