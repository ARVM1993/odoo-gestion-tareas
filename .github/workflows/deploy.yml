name: Desplegar - gestion_tareas

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Evita despliegues solapados en producción.
# Si llegan varios pushes seguidos se encolan (no se cancelan).
concurrency:
  group: deploy-odoo-produccion
  cancel-in-progress: false

# Permisos mínimos necesarios
permissions:
  contents: read

jobs:
  deploy:
    name: Desplegar gestion_tareas en EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------------------
      # 1. Descargar código del repositorio (con historial para git diff)
      # ------------------------------------------------------------------
      - name: Descargar código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # necesario para comparar BEFORE..AFTER sin problemas

      # ------------------------------------------------------------------
      # 2. Asegurar rsync disponible en el runner
      # ------------------------------------------------------------------
      - name: Instalar rsync
        run: |
          set -euo pipefail
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq rsync
          fi
          rsync --version | head -n1

      # ------------------------------------------------------------------
      # 3. Configurar conexión SSH
      # ------------------------------------------------------------------
      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Saneamos CRLF por si el secret viene de Windows
          printf '%s\n' "$EC2_SSH_KEY"     | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

          # Validación temprana de la clave
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      # ------------------------------------------------------------------
      # 4. Detectar cambios y sincronizar addon con EC2
      # ------------------------------------------------------------------
      - name: Sincronizar módulo con EC2
        id: sync
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # Por defecto asumimos que hay cambios (caso seguro).
          CODE_CHANGED=true
          MANIFEST_CHANGED=true

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then

            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER")

            if echo "$CHANGED_FILES" | grep -qE '\.(py|xml|js|css|scss|sass|csv|po|pot|png|jpg|jpeg|svg|gif)$'; then
              CODE_CHANGED=true
            else
              CODE_CHANGED=false
            fi

            if echo "$CHANGED_FILES" | grep -qE '(^|/)__manifest__\.py$'; then
              MANIFEST_CHANGED=true
            else
              MANIFEST_CHANGED=false
            fi
          fi

          echo "code_changed=$CODE_CHANGED"         >> "$GITHUB_OUTPUT"
          echo "manifest_changed=$MANIFEST_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Cambios de código: $CODE_CHANGED | manifest: $MANIFEST_CHANGED"

          # Crear directorio remoto del addon
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 \
            "$EC2_USER@$EC2_HOST" \
            'mkdir -p /home/ubuntu/odoo17/addons/gestion_tareas'

          # Sincronizar addon (la raíz del repo ES el módulo)
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='env/' \
            --exclude='node_modules/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.pyo' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            -e "ssh -o BatchMode=yes -i ~/.ssh/id_ed25519" \
            ./ \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/odoo17/addons/gestion_tareas/"

      # ------------------------------------------------------------------
      # 5. Limpiar caché, instalar/actualizar módulo y reiniciar si procede
      # ------------------------------------------------------------------
      - name: Instalar o actualizar módulo en EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          ODOO_DB: ${{ secrets.ODOO_DB }}
          ODOO_DB_PASSWORD: ${{ secrets.ODOO_DB_PASSWORD }}
          CODE_CHANGED: ${{ steps.sync.outputs.code_changed }}
          MANIFEST_CHANGED: ${{ steps.sync.outputs.manifest_changed }}
        run: |
          set -euo pipefail

          # 1. Escribir el script remoto en un fichero local
          cat > /tmp/remote_deploy.sh <<'REMOTE_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          cd /home/ubuntu/odoo17
          MODULE=/home/ubuntu/odoo17/addons/gestion_tareas

          # Password opcional: si está vacío, se omite
          DB_PASS_OPT=""
          if [ -n "${ODOO_DB_PASSWORD:-}" ]; then
            DB_PASS_OPT="--db_password=${ODOO_DB_PASSWORD}"
          fi

          echo "==> Limpiando caché Python del módulo..."
          sudo find "$MODULE" -type d -name '__pycache__' -prune -print -exec rm -rf {} +
          sudo find "$MODULE" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          echo "==> Comprobando servicios definidos en docker compose..."
          sudo docker compose config --services | grep -qx 'odoo' \
            || { echo "ERROR: servicio 'odoo' no definido"; exit 1; }
          sudo docker compose config --services | grep -qx 'db' \
            || { echo "ERROR: servicio 'db' no definido"; exit 1; }

          echo "==> Levantando DB si no está corriendo..."
          sudo docker compose up -d db

          echo "==> Esperando a PostgreSQL..."
          for i in $(seq 1 30); do
            if sudo docker compose exec -T db pg_isready -U odoo -d "$ODOO_DB" >/dev/null 2>&1; then
              echo "PostgreSQL listo."
              break
            fi
            echo "  intento $i/30..."
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "ERROR: PostgreSQL no responde"
              exit 1
            fi
          done

          if [ "$MANIFEST_CHANGED" = "true" ]; then
            echo "==> __manifest__.py cambió: actualizando base..."
            timeout 600 sudo docker compose run --rm --no-deps odoo \
              odoo -d "$ODOO_DB" \
              --db_host=db \
              --db_user=odoo \
              $DB_PASS_OPT \
              --no-http \
              --stop-after-init \
              --update=base
          else
            echo "==> Manifest sin cambios: se omite --update=base."
          fi

          echo "==> Consultando estado de gestion_tareas..."
          STATE=$(sudo docker compose exec -T db \
            psql -U odoo -d "$ODOO_DB" -tA \
            -c "SELECT state FROM ir_module_module WHERE name='gestion_tareas' LIMIT 1;" \
            | tr -d '[:space:]')

          if [ "$STATE" = "installed" ]; then
            echo "    Módulo instalado. Se actualizará (-u)."
            ACTION="-u"
          else
            echo "    Módulo no instalado (estado: '${STATE:-no registrado}'). Se instalará (-i)."
            ACTION="-i"
          fi

          echo "==> Ejecutando odoo $ACTION gestion_tareas..."
          timeout 900 sudo docker compose run --rm --no-deps odoo \
            odoo -d "$ODOO_DB" \
            --db_host=db \
            --db_user=odoo \
            $DB_PASS_OPT \
            --no-http \
            "$ACTION" gestion_tareas \
            --stop-after-init

          echo "==> Verificando estado final del módulo..."
          STATE=$(sudo docker compose exec -T db \
            psql -U odoo -d "$ODOO_DB" -tA \
            -c "SELECT state FROM ir_module_module WHERE name='gestion_tareas' LIMIT 1;" \
            | tr -d '[:space:]')

          if [ "$STATE" != "installed" ]; then
            echo "ERROR: gestion_tareas no quedó instalado. Estado: '${STATE:-no registrado}'"
            exit 1
          fi
          echo "    Estado final: $STATE"

          if [ "$CODE_CHANGED" = "true" ]; then
            echo "==> Cambios de código detectados: reiniciando Odoo..."
            sudo docker compose restart odoo
            echo "==> Esperando a que Odoo arranque..."
            sleep 10
            if ! sudo docker compose ps odoo | grep -qE 'Up|running'; then
              echo "ERROR: Odoo no está corriendo tras el reinicio."
              sudo docker compose logs --tail=100 odoo
              exit 1
            fi
            echo "    Odoo está Up."
          else
            echo "==> Sin cambios de código: no se reinicia Odoo."
          fi

          echo "==> Estado final de contenedores:"
          sudo docker compose ps

          echo "==> Últimas líneas de log de Odoo:"
          sudo docker compose logs --tail=20 odoo || true

          echo "✅ Despliegue de gestion_tareas completado correctamente."
          REMOTE_SCRIPT

          # CRÍTICO: eliminar la indentación de 10 espacios que YAML mete en el heredoc
          sed -i 's/^          //' /tmp/remote_deploy.sh

          # Sanity check: el script debe empezar por #!/usr/bin/env bash
          head -n1 /tmp/remote_deploy.sh | grep -q '^#!/usr/bin/env bash' \
            || { echo "ERROR: el script remoto no empieza con shebang"; head -n3 /tmp/remote_deploy.sh; exit 1; }

          chmod +x /tmp/remote_deploy.sh

          # 2. Copiarlo a la EC2
          scp -o BatchMode=yes -i ~/.ssh/id_ed25519 \
            /tmp/remote_deploy.sh \
            "$EC2_USER@$EC2_HOST:/tmp/remote_deploy.sh"

          # 3. Ejecutarlo pasando las variables como entorno
          ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 \
            "$EC2_USER@$EC2_HOST" \
            "ODOO_DB='$ODOO_DB' ODOO_DB_PASSWORD='$ODOO_DB_PASSWORD' CODE_CHANGED='$CODE_CHANGED' MANIFEST_CHANGED='$MANIFEST_CHANGED' bash /tmp/remote_deploy.sh"

      # ------------------------------------------------------------------
      # 6. Confirmación final del step
      # ------------------------------------------------------------------
      - name: Resultado del despliegue
        run: |
          echo "✅ Despliegue de gestion_tareas completado correctamente."
          echo "   Commit: ${{ github.sha }}"
          echo "   Ref:    ${{ github.ref_name }}"
          echo "   Trigger:${{ github.event_name }}"
